name: Daily opportunity check

# IMPORTANT — GitHub Actions cron schedules are "best effort" et peuvent être
# retardés / skippés pendant les pics de charge. Pour minimiser le risque :
#   1) Éviter les minutes rondes (:00) qui sont les pires (peak load).
#   2) Lancer 2 fois par jour : si l'un est skippé, l'autre prend le relais.
#   3) Pousser ce fichier resync les schedules chez GitHub si bloqués.
#
# Heures choisies :
#   07:23 UTC = 08:23/09:23 Zurich → run du matin (catch les changements US overnight)
#   15:23 UTC = 16:23/17:23 Zurich → run d'après-midi (catch les Google Alerts arrivées dans la journée)

on:
  schedule:
    - cron: '23 7 * * *'
    - cron: '23 15 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python bot.py

      - name: Commit updated state and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/
          if git diff --staged --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "Update state and site $(date -u +%Y-%m-%d-%H%M)"
            git push
          fi
