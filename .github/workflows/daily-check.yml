name: Daily opportunity check

on:
  schedule:
    # 06:00 UTC = 07:00 Zurich en hiver, 08:00 en été.
    - cron: '0 6 * * *'
  workflow_dispatch:  # Permet de lancer manuellement depuis l'onglet Actions

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Nécessaire pour commit le state et le site

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optionnels — laisse vides ou ne définis pas les secrets si tu ne
          # veux pas (encore) brancher le module email. Le bot détecte l'absence.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python bot.py

      - name: Commit updated state and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ docs/
          if git diff --staged --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "Update state and site $(date -u +%Y-%m-%d)"
            git push
          fi
